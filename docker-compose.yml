services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: procurement-sqlserver

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SQLSERVER_SA_PASSWORD:-LOCAL_ONLY_CHANGE_THIS_PASSWORD_1234567890!}"

    ports:
      - "1434:1433"

    volumes:
      - sqlserver-data:/var/opt/mssql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -C -Q "SELECT 1" || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: procurement-api

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080

      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=ProcurementDb;User Id=sa;Password=${SQLSERVER_SA_PASSWORD:-LOCAL_ONLY_CHANGE_THIS_PASSWORD_1234567890!};TrustServerCertificate=True;"

      JwtSettings__SecretKey: "${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set to a random value of at least 32 bytes}"
      JwtSettings__Issuer: "Procurement.Api"
      JwtSettings__Audience: "Procurement.Client"
      JwtSettings__ExpirationMinutes: "120"

    ports:
      - "8080:8080"

    depends_on:
      sqlserver:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:8080/health || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  sqlserver-data:
